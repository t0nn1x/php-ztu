version: '3.8'

services:
  # PHP Service
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: hotel_reservation_php
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - postgres
    networks:
      - hotel_network
    environment:
      - APP_ENV=dev
      - DATABASE_URL=postgresql://hotel_user:hotel_password@postgres:5432/hotel_db

  # Nginx Service
  nginx:
    image: nginx:alpine
    container_name: hotel_reservation_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - hotel_network

  # PostgreSQL Service
  postgres:
    image: postgres:16-alpine
    container_name: hotel_reservation_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=hotel_user
      - POSTGRES_PASSWORD=hotel_password
      - POSTGRES_DB=hotel_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hotel_network

  # PgAdmin for PostgreSQL management (optional)
  pgadmin:
    image: dpage/pgadmin4
    container_name: hotel_reservation_pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@hotel.com
      - PGADMIN_DEFAULT_PASSWORD=hotel_admin
    depends_on:
      - postgres
    networks:
      - hotel_network

networks:
  hotel_network:
    driver: bridge

volumes:
  postgres_data:
