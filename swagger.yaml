openapi: 3.0.0
info:
  title: Hotel Management API
  description: API for managing hotel rooms, reservations, and user accounts
  version: 1.0.0
  contact:
    name: Hotel Management Team

servers:
  - url: /api
    description: API Base URL

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        roles:
          type: array
          items:
            type: string

    Room:
      type: object
      properties:
        id:
          type: integer
        number:
          type: string
        status:
          type: string
          enum: [available, occupied, maintenance]
        roomType:
          $ref: '#/components/schemas/RoomType'

    RoomType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        capacity:
          type: integer
        basePrice:
          type: number
          format: float

    Reservation:
      type: object
      properties:
        id:
          type: integer
        checkIn:
          type: string
          format: date-time
        checkOut:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, confirmed, cancelled, completed]
        user:
          $ref: '#/components/schemas/User'
        room:
          $ref: '#/components/schemas/Room'
        totalPrice:
          type: number
          format: float

    Promotion:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        description:
          type: string
        discountPercentage:
          type: number
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        roomType:
          $ref: '#/components/schemas/RoomType'

    Amenity:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        category:
          type: string
        isFeatured:
          type: boolean

paths:
  /register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - firstName
                - lastName
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                firstName:
                  type: string
                lastName:
                  type: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid input
        '409':
          description: User already exists

  /login:
    post:
      summary: Login user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Invalid credentials

  /rooms:
    get:
      summary: Get all rooms
      tags:
        - Rooms
      parameters:
        - in: query
          name: page
          schema:
            type: integer
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
          description: Items per page
      responses:
        '200':
          description: List of rooms
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
                  total:
                    type: integer
                  page:
                    type: integer
                  pages:
                    type: integer

  /rooms/available:
    get:
      summary: Get available rooms
      tags:
        - Rooms
      parameters:
        - in: query
          name: checkIn
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: checkOut
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of available rooms
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'

  /room-types:
    get:
      summary: Get all room types
      tags:
        - Room Types
      responses:
        '200':
          description: List of room types
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoomType'

  /room-types/with-promotions:
    get:
      summary: Get room types with active promotions
      tags:
        - Room Types
      responses:
        '200':
          description: List of room types with promotions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoomType'

  /reservations:
    get:
      summary: Get all reservations
      tags:
        - Reservations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of reservations
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reservation'
    post:
      summary: Create a new reservation
      tags:
        - Reservations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - roomId
                - checkIn
                - checkOut
              properties:
                roomId:
                  type: integer
                checkIn:
                  type: string
                  format: date-time
                checkOut:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'

  /reservations/{id}/calculate-price:
    get:
      summary: Calculate reservation total price
      tags:
        - Reservations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Calculated price
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    format: float

  /promotions/active:
    get:
      summary: Get active promotions
      tags:
        - Promotions
      responses:
        '200':
          description: List of active promotions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Promotion'

  /promotions/{id}/calculate-price:
    get:
      summary: Calculate price with promotion
      tags:
        - Promotions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: price
          required: true
          schema:
            type: number
            format: float
      responses:
        '200':
          description: Calculated price with promotion
          content:
            application/json:
              schema:
                type: object
                properties:
                  original_price:
                    type: number
                    format: float
                  discounted_price:
                    type: number
                    format: float
                  savings:
                    type: number
                    format: float

  /amenities:
    get:
      summary: Get all amenities
      tags:
        - Amenities
      responses:
        '200':
          description: List of amenities
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Amenity'

  /amenities/featured:
    get:
      summary: Get featured amenities
      tags:
        - Amenities
      responses:
        '200':
          description: List of featured amenities
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Amenity'

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: User authentication endpoints
  - name: Rooms
    description: Room management endpoints
  - name: Room Types
    description: Room type management endpoints
  - name: Reservations
    description: Reservation management endpoints
  - name: Promotions
    description: Promotion management endpoints
  - name: Amenities
    description: Amenity management endpoints 
